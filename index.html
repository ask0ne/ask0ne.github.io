<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>moved to whelmedthinker.com</title>
    <meta name="robots" content="noindex">
    <link rel="canonical" href="https://whelmedthinker.com/">
    <meta http-equiv="refresh" content="0; url=https://whelmedthinker.com/">
    <script>window.location.replace("https://whelmedthinker.com/");</script>
    <style>
        :root { --bg: #e9e6df; --ink: #3a3835; --dim: #6f6c66; --accent: #b4573a; color-scheme: light dark; }
        @media (prefers-color-scheme: dark) { :root { --bg: #1d1c1b; --ink: #d9d5ce; --dim: #9d9890; --accent: #e08a69; } }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font-family: system-ui, sans-serif; text-align: center; padding: 1.5rem; }
        p { color: var(--dim); margin: 0 0 1.5rem; }
        a.btn { display: inline-block; padding: .75rem 1.5rem; border: .0625rem solid var(--accent); border-radius: .5rem; color: var(--accent); text-decoration: none; }
        a.btn:hover { background: var(--accent); color: var(--bg); }
    </style>
</head>
<body>
    <main>
        <p>this site has moved. taking you there now.</p>
        <a class="btn" href="https://whelmedthinker.com/">go to whelmedthinker.com</a>
    </main>
</body>
</html>
